name: agent-harness

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guardrails:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Verify guardrail behavior
        run: python3 -m unittest discover -s scripts -p 'test_agent_guard*.py'
      - name: Parse Codex configuration
        run: |
          python3 - <<'PY'
          import json
          import tomllib
          from pathlib import Path

          for path in Path('.codex').rglob('*.toml'):
              tomllib.loads(path.read_text())
          json.loads(Path('.codex/hooks.json').read_text())
          PY
