name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Re-run against main without pushing a commit — the bootstrap uses this when
  # a re-run finds nothing to commit and so fires no push event.
  workflow_dispatch:

# A superseded run tells you nothing a newer one won't: cancel, don't queue.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict

      - name: Cache deps and build
        uses: actions/cache@v5
        with:
          path: |
            deps
            _build
          key: mix-${{ runner.os }}-${{ hashFiles('.tool-versions', 'mix.lock') }}
          restore-keys: |
            mix-${{ runner.os }}-

      - name: Fetch dependencies
        run: mix deps.get

      # Formatting first: it is the fastest check and the one most likely to
      # fail, so a red run says why in seconds rather than after a full compile.
      - name: Check formatting
        run: mix format --check-formatted

      # A warning in a library is a bug in someone else's build.
      - name: Compile
        run: mix compile --warnings-as-errors

      - name: Run tests
        run: mix test

      - name: Run strict Cucumber acceptance tests
        run: MIX_ENV=test mix cucumber

      - name: Static analysis
        run: mix dialyzer

      - name: Audit dependencies
        run: mix hex.audit

      - name: Build documentation
        run: mix docs --warnings-as-errors

      - name: Verify package in a clean production consumer
        run: scripts/package_smoke.sh

  minimum:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.19.0-otp-28'
          otp-version: '28.0'
          version-type: strict
      - name: Fetch dependencies
        run: mix deps.get
      - name: Verify oldest supported toolchain
        run: mix compile --warnings-as-errors && mix test
      - name: Run strict Cucumber acceptance tests
        run: MIX_ENV=test mix cucumber
      - name: Verify minimum runtime dependencies without tracing
        run: OTLP_SMOKE_DEPENDENCY_SET=minimum scripts/package_smoke.sh
      - name: Verify minimum optional tracing API
        run: OTLP_SMOKE_DEPENDENCY_SET=minimum_with_tracing scripts/package_smoke.sh
