name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Re-run against main without pushing a commit — the bootstrap uses this when
  # a re-run finds nothing to commit and so fires no push event.
  workflow_dispatch:

# A superseded run tells you nothing a newer one won't: cancel, don't queue.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions

      - name: Cache deps and build
        uses: actions/cache@v5
        with:
          path: |
            deps
            _build
          key: mix-${{ runner.os }}-${{ hashFiles('.tool-versions', 'mix.lock') }}
          restore-keys: |
            mix-${{ runner.os }}-

      - name: Fetch dependencies
        run: mix deps.get

      # Formatting first: it is the fastest check and the one most likely to
      # fail, so a red run says why in seconds rather than after a full compile.
      - name: Check formatting
        run: mix format --check-formatted

      # A warning in a library is a bug in someone else's build.
      - name: Compile
        run: mix compile --warnings-as-errors

      - name: Run tests
        run: mix test

      - name: Static analysis
        run: mix dialyzer

      - name: Audit dependencies
        run: mix hex.audit

      - name: Build documentation
        run: mix docs --warnings-as-errors

      - name: Verify package in a clean production consumer
        run: scripts/package_smoke.sh
